spring:
  application:
    name: dfs-upload-orchestrator
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8083}

grpc:
  client:
    # One block per node in dfs.upload.blob-nodes, named by the node's id. The id
    # is the key placement ranks over and the name of the channel, so a node is
    # configured once and called by one name everywhere.
    #
    # Internal cluster traffic, and nothing here speaks TLS yet; the starter
    # would otherwise default to it and fail to connect.
    blob-node-0:
      address: ${BLOB_NODE_0_TARGET:static://localhost:9090}
      negotiation-type: plaintext

dfs:
  service-name: upload-orchestrator
  environment: ${DFS_ENV:local}
  # Must match the auth service byte for byte: this service validates the
  # caller's token before forwarding it.
  security:
    jwt:
      issuer: dfs-auth
      signing-secret: ${JWT_SIGNING_SECRET:change-me-in-production}
  upload:
    chunk-size: 8MB
    max-concurrent-chunks: 8
    multipart-session-ttl: 24h
    # Scaffolding: the metadata service stays on REST (ADR 10), so nothing reads
    # this yet. Kept because that decision is deliberate, not an omission.
    metadata-grpc-target: static://localhost:9082
    metadata-base-url: ${METADATA_SERVICE_URL:http://localhost:8082}
    # The cluster's nodes, ranked over by rendezvous hashing (ADR 11). Each id
    # needs a matching grpc.client.<id> block above.
    #
    # blob-node-0 is the id every pre-placement chunk was recorded under, so it
    # stays in this list whether or not it is still preferred for new writes —
    # dropping it would make those chunks unreachable.
    blob-nodes:
      - blob-node-0
    # Content is streamed a chunk at a time, so this caps how large an object may
    # be rather than how much heap one request can take.
    max-object-size: 100MB
    downstream-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.dfs: DEBUG
