spring:
  application:
    name: dfs-upload-orchestrator
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8083}

grpc:
  client:
    blob-node:
      # One address, declared once above: this block is the channel's, but the
      # value belongs with the service's other downstream addresses.
      address: ${dfs.upload.blob-grpc-target}
      # Internal cluster traffic, and nothing else here speaks TLS yet. The
      # starter would otherwise default to it and fail to connect.
      negotiation-type: plaintext

dfs:
  service-name: upload-orchestrator
  environment: ${DFS_ENV:local}
  # Must match the auth service byte for byte: this service validates the
  # caller's token before forwarding it.
  security:
    jwt:
      issuer: dfs-auth
      signing-secret: ${JWT_SIGNING_SECRET:change-me-in-production}
  upload:
    chunk-size: 8MB
    max-concurrent-chunks: 8
    multipart-session-ttl: 24h
    # The byte path is gRPC; metadata stays REST, so the orchestrator reaches it
    # through the same public API as any other client (ADR 10). The metadata
    # target below is scaffolding and is not read by anything yet.
    metadata-grpc-target: static://localhost:9082
    blob-grpc-target: ${BLOB_GRPC_TARGET:static://localhost:9090}
    metadata-base-url: ${METADATA_SERVICE_URL:http://localhost:8082}
    # The node chunks are written to, recorded against each chunk so reads follow
    # where the bytes actually went (ADR 11). One node until placement arrives.
    blob-node-id: ${BLOB_NODE_ID:blob-node-0}
    # Content is streamed a chunk at a time, so this caps how large an object may
    # be rather than how much heap one request can take.
    max-object-size: 100MB
    downstream-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.dfs: DEBUG
