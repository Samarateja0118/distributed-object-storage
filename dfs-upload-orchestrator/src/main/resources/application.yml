spring:
  application:
    name: dfs-upload-orchestrator
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8083}

grpc:
  client:
    # Every blob node gets its own channel, blob-node-<id>, and these settings
    # apply to all of them; one node can be tuned under grpc.client.blob-node-<id>.
    # Addresses are not set here: each comes from its entry in dfs.upload.blob-nodes.
    GLOBAL:
      # Internal cluster traffic, and nothing else here speaks TLS yet. The
      # starter would otherwise default to it and fail to connect.
      negotiation-type: plaintext

dfs:
  service-name: upload-orchestrator
  environment: ${DFS_ENV:local}
  # Must match the auth service byte for byte: this service validates the
  # caller's token before forwarding it.
  security:
    jwt:
      issuer: dfs-auth
      signing-secret: ${JWT_SIGNING_SECRET:change-me-in-production}
  upload:
    chunk-size: 8MB
    max-concurrent-chunks: 8
    # The byte path is gRPC; metadata stays REST, so the orchestrator reaches it
    # through the same public API as any other client (ADR 10). The metadata
    # target below is scaffolding and is not read by anything yet.
    metadata-grpc-target: static://localhost:9082
    metadata-base-url: ${METADATA_SERVICE_URL:http://localhost:8082}
    # The static node set chunks are placed across by rendezvous hashing (ADR 11).
    # The id is what is recorded against each chunk and what reads follow, so it
    # must never be renamed or reused while chunks are recorded on it. Every chunk
    # written before Phase 2 is recorded on blob-node-0, so that id must stay in
    # the set. Adding a node is a redeploy; override the whole list to add one.
    blob-nodes:
      - id: ${BLOB_NODE_ID:blob-node-0}
        target: ${BLOB_GRPC_TARGET:static://localhost:9090}
    # Caps the bytes in one request — a single upload, or one part of a multipart
    # upload — rather than heap, since content is streamed a chunk at a time. A
    # multipart object may be larger; multipart sessions and their TTL belong to
    # the metadata service (ADR 12).
    max-object-size: 100MB
    downstream-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.dfs: DEBUG
