spring:
  application:
    name: dfs-upload-orchestrator
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8083}

dfs:
  service-name: upload-orchestrator
  environment: ${DFS_ENV:local}
  # Must match the auth service byte for byte: this service validates the
  # caller's token before forwarding it.
  security:
    jwt:
      issuer: dfs-auth
      signing-secret: ${JWT_SIGNING_SECRET:change-me-in-production}
  upload:
    chunk-size-mb: 8
    max-concurrent-chunks: 8
    multipart-session-ttl: 24h
    # Phase 1 talks to both services over REST. The gRPC targets below are
    # scaffolding for Phase 2 and are not read by anything yet.
    metadata-grpc-target: static://localhost:9082
    blob-grpc-target: static://localhost:9090
    blob-base-url: ${BLOB_NODE_URL:http://localhost:8090}
    metadata-base-url: ${METADATA_SERVICE_URL:http://localhost:8082}
    # An upload is buffered whole in order to digest it, so this bounds heap
    # per in-flight request, not just request size.
    max-object-size: 100MB
    downstream-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.dfs: DEBUG
