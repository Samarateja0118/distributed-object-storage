name: CI

on:
  push:
    # Milestone branches build on every push, so a phase's work gets CI feedback
    # while it is being written rather than only once it is proposed for merge.
    branches: [main, 'phase-2/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete, but never
# cancel main: its runs are what the build badge reports.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Testcontainers starts PostgreSQL itself; deploy/docker-compose.yml is for
      # running services by hand and is deliberately not used here. The runner's
      # preinstalled Docker daemon needs no configuration.
      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/'
          retention-days: 7
