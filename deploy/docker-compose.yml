services:
  postgres:
    image: postgres:16-alpine
    container_name: dfs-postgres
    environment:
      POSTGRES_DB: dfs
      POSTGRES_USER: dfs
      POSTGRES_PASSWORD: dfs
    ports:
      - "5432:5432"
    volumes:
      - dfs-postgres-data:/var/lib/postgresql/data
      # Creates one database per schema-owning service. First-init only.
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfs -d dfs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dfs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Apache's own image rather than bitnami/kafka, which was withdrawn from
  # Docker Hub — an unresolvable image aborts the whole `compose up`, not just
  # this service. Note the env vars are plain KAFKA_*, not bitnami's KAFKA_CFG_*.
  kafka:
    image: apache/kafka:3.9.1
    container_name: dfs-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-node cluster: the defaults of 3 would leave internal topics
      # permanently under-replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Application services are started locally via Maven during development.
  # Uncomment and add Dockerfiles in Phase 1 for containerized deployment.
  #
  # gateway:
  #   build:
  #     context: ..
  #     dockerfile: deploy/docker/Dockerfile.gateway
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   ports:
  #     - "8080:8080"

volumes:
  dfs-postgres-data:
