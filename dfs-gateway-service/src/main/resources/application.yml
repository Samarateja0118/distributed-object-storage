spring:
  application:
    name: dfs-gateway-service
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

dfs:
  service-name: gateway
  environment: ${DFS_ENV:local}
  gateway:
    request-timeout: 30s
    max-request-size-mb: 100
    routes:
      - id: auth
        path-prefix: /api/v1/auth
        upstream-url: http://localhost:8081
      - id: metadata
        path-prefix: /api/v1/buckets
        upstream-url: http://localhost:8082
      - id: upload
        path-prefix: /api/v1/uploads
        upstream-url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.dfs: DEBUG
