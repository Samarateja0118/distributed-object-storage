spring:
  application:
    name: dfs-metadata-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dfs_metadata}
    username: ${POSTGRES_USER:dfs}
    password: ${POSTGRES_PASSWORD:dfs}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}

grpc:
  server:
    port: ${GRPC_PORT:9082}

dfs:
  service-name: metadata
  environment: ${DFS_ENV:local}
  # Must match the auth service; this service only validates, it never mints.
  security:
    jwt:
      issuer: dfs-auth
      signing-secret: ${JWT_SIGNING_SECRET:change-me-in-production}
  metadata:
    cache-ttl: 10m
    default-replication-factor: 3
    default-chunk-size-mb: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.dfs: DEBUG
