spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
# Redis and Kafka clients connect lazily, so their beans are left wired but
# unused; Phase 1 metadata tests exercise PostgreSQL only.

# The gRPC server is not exercised by Phase 1 metadata tests.
grpc:
  server:
    port: -1

# Must match what AbstractMetadataIT signs its tokens with.
dfs:
  security:
    jwt:
      issuer: dfs-auth-test
      signing-secret: test-signing-secret-not-used-outside-tests
  metadata:
    multipart:
      # Long enough that the scheduled sweep never runs during a test: the
      # expiry tests call it directly against a clock they control, and a
      # background run would race them.
      sweep-interval: 1h

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
