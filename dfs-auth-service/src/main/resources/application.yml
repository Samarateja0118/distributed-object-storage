spring:
  application:
    name: dfs-auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dfs}
    username: ${POSTGRES_USER:dfs}
    password: ${POSTGRES_PASSWORD:dfs}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

dfs:
  service-name: auth
  environment: ${DFS_ENV:local}
  auth:
    api-key-cache-ttl: 5m
    jwt:
      issuer: dfs-auth
      access-token-ttl: 1h
      signing-secret: ${JWT_SIGNING_SECRET:change-me-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.dfs: DEBUG
