spring:
  application:
    name: dfs-replication-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dfs}
    username: ${POSTGRES_USER:dfs}
    password: ${POSTGRES_PASSWORD:dfs}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dfs-replication
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8084}

dfs:
  service-name: replication
  environment: ${DFS_ENV:local}
  replication:
    target-replication-factor: 3
    max-concurrent-replications: 16
    chunk-registered-topic: dfs.chunk.registered
    blob-grpc-target-prefix: static://localhost:909

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.dfs: DEBUG
