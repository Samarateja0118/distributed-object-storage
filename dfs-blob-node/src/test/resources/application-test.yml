spring:
  mvc:
    problemdetails:
      enabled: true

# No network port in tests: the gRPC surface is exercised over the in-process
# transport, which needs no free port and leaves nothing to clean up between
# runs. Global interceptors still apply there, so authentication is exercised
# for real rather than bypassed.
grpc:
  server:
    port: -1
    in-process-name: blob-node-test

dfs:
  security:
    jwt:
      issuer: dfs-auth-test
      signing-secret: test-signing-secret-not-used-outside-tests

logging:
  level:
    root: WARN
    com.dfs: INFO
