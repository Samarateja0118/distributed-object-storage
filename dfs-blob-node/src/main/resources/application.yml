spring:
  application:
    name: dfs-blob-node
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8090}

grpc:
  server:
    port: ${GRPC_PORT:9090}

dfs:
  service-name: blob-node
  environment: ${DFS_ENV:local}
  # Must match the auth service; this node only validates, it never mints.
  security:
    jwt:
      issuer: dfs-auth
      signing-secret: ${JWT_SIGNING_SECRET:change-me-in-production}
  blob:
    # Informational: nothing here reads it yet, because a node does not report
    # its own identity — the orchestrator's dfs.upload.blob-nodes is what names
    # nodes, and what gets recorded against a chunk. Defaulted to match that
    # list's single member so one local cluster does not have two names for the
    # same node.
    node-id: ${BLOB_NODE_ID:blob-node-0}
    storage-root-path: ${BLOB_STORAGE_PATH:./blob-data/node-1}
    capacity-bytes: ${BLOB_CAPACITY_BYTES:107374182400}
    rack: ${BLOB_RACK:rack-a}
    zone: ${BLOB_ZONE:zone-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.dfs: DEBUG
